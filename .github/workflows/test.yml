name: test

on:
  pull_request:
    paths:
      - "worker/**"
      - "last-mile/**"
      - ".github/workflows/test.yml"
  push:
    branches: [main]

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check every module
        run: for f in src/*.js; do node --check "$f"; done
      - name: WebAuthn roundtrip
        run: node test/webauthn.test.mjs
      - name: Agent-bearer lifecycle
        run: node test/agents.test.mjs
      - name: SSRF guard
        run: node test/ssrf.test.mjs
      - name: Wallet app render
        run: node test/app.test.mjs
      - name: Web Push module
        run: node test/push.test.mjs
      - name: GitHub App JWT
        run: node test/github-app.test.mjs
      - name: Stripe billing
        run: node test/stripe.test.mjs
      - name: Last-mile routing
        run: node test/lastmile.test.mjs
      - name: Seal ticket
        run: node test/ticket.test.mjs
      - name: Claim codes
        run: node test/claim.test.mjs
      - name: Connect Cloudflare (OAuth + provisioning)
        run: node test/cloudflare.test.mjs
      - name: CardState Durable Object (kill-switch)
        run: node test/cardstate.test.mjs
      - name: Charge through the card DO (freeze/revoke/cap)
        run: node test/charge-freeze.test.mjs
      - name: OnceGate one-time-token DO
        run: node test/oncegate.test.mjs
      - name: GDPR data rights (export / erase / lapse sweep)
        run: node test/gdpr.test.mjs
      - name: Binary-safe charge (audio/image responses don't get corrupted)
        run: node test/binary-charge.test.mjs

  last-mile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: last-mile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check every module
        run: for f in src/*.js; do node --check "$f"; done
      - name: Binary-safe charge (mirrors the wallet's own copy of readUpstreamBody)
        run: node test/binary-charge.test.mjs
