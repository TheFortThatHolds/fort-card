name: deploy

# One-time setup, then every push to main ships the worker — no local wrangler needed.
# Repo secrets required (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN    a Workers Scripts:Edit token
#   CLOUDFLARE_ACCOUNT_ID   the account the worker lives in
#   KV_NAMESPACE_ID         the VAULT KV namespace id (injected so the public template stays generic)
# The worker's runtime vars + secrets (GH_CLIENT_ID, GH_CLIENT_SECRET, MASTER_KEY, …) are set on the
# Worker in the Cloudflare dashboard; keep_vars=true preserves them across deploys.

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bind the VAULT KV namespace for this deployment
        run: sed -i "s|PASTE_YOUR_KV_NAMESPACE_ID_HERE|${{ secrets.KV_NAMESPACE_ID }}|" wrangler.toml
      - name: Deploy
        run: npx --yes wrangler@3 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
