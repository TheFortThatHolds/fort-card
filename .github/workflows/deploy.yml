name: deploy

# Configure ONE screen (GitHub repo → Settings → Secrets and variables → Actions), then run this.
# It creates the KV namespace, binds the custom domain, and sets the [vars]. It ships CODE + config
# ONLY — it never touches your worker secrets.
#
# CI deploy credentials (Settings → Actions → Secrets) — used only to talk to Cloudflare, not stored on the worker:
#   CLOUDFLARE_API_TOKEN   use Cloudflare's "Edit Cloudflare Workers" token template + your zone
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare dashboard, right sidebar
#
# Worker secrets are set ONCE, out of band, directly on the Worker (never via CI):
#   npx wrangler secret put GH_CLIENT_SECRET   # GitHub App client secret (OAuth login)
#   npx wrangler secret put GH_APP_PRIVATE_KEY # wake-back app key
#   npx wrangler secret put STRIPE_KEY         # billing (optional)
#   npx wrangler secret put MASTER_KEY         # custodial relic — prefer the customer lockbox instead
#
# Variables (Settings → Actions → Variables) — all optional; each falls back to the operator's
# current value so a deploy works with none of them set:
#   GH_CLIENT_ID           the GitHub App's client id (Iv23…)
#   WALLET_DOMAIN          e.g. card.example.com  (callback/rpid/origin are derived from it)
#   GH_APP_ID              the wake-back GitHub App's numeric id
#   OPERATOR_SPACE         the billing space, e.g. github:<id>
#   CF_OAUTH_CLIENT_ID     (optional) Connect Cloudflare one-tap onboarding — the Cloudflare OAuth
#                          client id (non-secret, PKCE). Unset → onboarding falls back to claim-code.
# Subscriptions turn on with NO key here: with OPERATOR_SPACE set, issue ONE Stripe card in that
# space's wallet (allowed host api.stripe.com) and the worker bills by charging that card.

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WR: npx --yes wrangler@3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create or reuse the VAULT KV namespace
        run: |
          set -e
          id=$($WR kv namespace list 2>/dev/null | jq -r '.[] | select(.title=="fort-card-VAULT") | .id')
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            id=$($WR kv namespace create VAULT | grep -oE '[0-9a-f]{32}' | head -1)
          fi
          test -n "$id"
          sed -i "s|PASTE_YOUR_KV_NAMESPACE_ID_HERE|$id|" wrangler.toml
          echo "KV namespace bound."

      - name: Inject operator instance config (domain + GitHub App + billing)
        # The committed wrangler.toml is a clean self-host template (no domain, no identity vars) so
        # the "Deploy to Cloudflare" button works for strangers. Here we append the operator's managed
        # config for the hosted instance. Every value comes from a repo Actions Variable — NONE of the
        # operator's data lives in the repo. If a required Variable is missing we FAIL the deploy (the
        # running Worker keeps serving) rather than ship a broken config.
        env:
          DOMAIN: ${{ vars.WALLET_DOMAIN }}
          CLIENT_ID: ${{ vars.GH_CLIENT_ID }}
          APP_ID: ${{ vars.GH_APP_ID }}
          OP_SPACE: ${{ vars.OPERATOR_SPACE }}
          # Forgiving on purpose: read from the Variables tab OR the Secrets tab. The client id is
          # non-secret (PKCE), so either is fine — and operators (incl. us) habitually drop it in
          # Secrets. Whichever is set wins; the deploy doesn't care which tab it landed in.
          CF_CLIENT_ID: ${{ vars.CF_OAUTH_CLIENT_ID || secrets.CF_OAUTH_CLIENT_ID }}
        run: |
          set -e
          missing=
          for v in DOMAIN CLIENT_ID APP_ID OP_SPACE; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required Actions Variable(s):$missing — set WALLET_DOMAIN, GH_CLIENT_ID, GH_APP_ID, OPERATOR_SPACE (Settings → Secrets and variables → Actions → Variables). Aborting; the live Worker is untouched."
            exit 1
          fi
          {
            echo ""
            echo "# ── injected at deploy for the operator's managed instance (not in the committed template) ──"
            echo "routes = ["
            echo "  { pattern = \"$DOMAIN\", custom_domain = true }"
            echo "]"
            echo "[vars]"
            echo "GH_CLIENT_ID = \"$CLIENT_ID\""
            echo "GH_CALLBACK_URL = \"https://$DOMAIN/callback\""
            echo "WALLET_RPID = \"$DOMAIN\""
            echo "WALLET_ORIGIN = \"https://$DOMAIN\""
            echo "GH_APP_ID = \"$APP_ID\""
            echo "OPERATOR_SPACE = \"$OP_SPACE\""
            echo "SUBSCRIPTION_PRICE_CENTS = \"800\""
            echo "SUBSCRIPTION_CURRENCY = \"usd\""
            echo "SUBSCRIPTION_PRODUCT_NAME = \"Fort Card\""
          } >> wrangler.toml
          # Optional: Connect Cloudflare one-tap onboarding. Non-secret (PKCE public client), so it's
          # an Actions Variable, not a secret. If unset, the /cloudflare/connect route returns 503 and
          # onboarding falls back to claim-code / paste-URL — the deploy is never blocked on it.
          if [ -n "$CF_CLIENT_ID" ]; then
            echo "CF_OAUTH_CLIENT_ID = \"$CF_CLIENT_ID\"" >> wrangler.toml
            echo "Connect Cloudflare enabled (CF_OAUTH_CLIENT_ID set)."
          else
            echo "CF_OAUTH_CLIENT_ID not set — Connect Cloudflare onboarding stays off (claim-code/paste-URL still work)."
          fi
          echo "Operator instance config injected for $DOMAIN."

      - name: Deploy
        run: $WR deploy

      # ── Secrets are NOT handled here, on purpose. ──
      # The deploy ships CODE + config only; it never touches your keys. Worker secrets
      # (GH_CLIENT_SECRET, GH_APP_PRIVATE_KEY, STRIPE_KEY, and the vault MASTER_KEY) are set
      # ONCE, out of band, directly on the Worker — `npx wrangler secret put <NAME>` — and they
      # persist across deploys untouched. CI has no business carrying credentials through a
      # runner or holding them in GitHub Actions secrets.
      #   NOTE: MASTER_KEY is a custodial relic. The sovereign path is the customer's own lockbox,
      #   which self-mints its master key on its own Cloudflare; the control plane should hold none.
