name = "fort-card"
main = "src/worker.js"
compatibility_date = "2026-06-01"
# Keep secrets (GH_CLIENT_SECRET, MASTER_KEY) set on the Worker across deploys.
keep_vars = true

kv_namespaces = [
  { binding = "VAULT", id = "PASTE_YOUR_KV_NAMESPACE_ID_HERE" }
]

# Custom domain — Cloudflare binds this on deploy.
routes = [
  { pattern = "card.thefortthatholds.com", custom_domain = true }
]

# Non-secret identity config (a client id is public by design; the domain is public).
# Secrets live on the Worker, never here. Forking for your own instance? Change these four
# and the route above to your domain + GitHub App client id.
[vars]
GH_CLIENT_ID = "Iv23liaQG8mlnPo1VTl2"
GH_CALLBACK_URL = "https://card.thefortthatholds.com/callback"
WALLET_RPID = "card.thefortthatholds.com"
WALLET_ORIGIN = "https://card.thefortthatholds.com"
GH_APP_ID = "4056461"
# Billing runs THROUGH A CARD, never a raw key. OPERATOR_SPACE is the operator's space; the operator
# issues one Stripe card there (allowed host api.stripe.com) and the worker does every Stripe call by
# charging it — the key is injected server-side, never read by billing. Billing stays OFF until that
# card exists, so this is safe to ship empty: issue the card and the $8/mo door turns on (no redeploy).
# Freeze the card to stop billing. ToS is Stripe Checkout's native consent (URL set in Stripe settings).
OPERATOR_SPACE = "github:208725367"
SUBSCRIPTION_PRICE_CENTS = "800"
SUBSCRIPTION_CURRENCY = "usd"
SUBSCRIPTION_PRODUCT_NAME = "Fort Card"
